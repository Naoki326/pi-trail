<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pi trail · 输入轨迹</title>
<style>
  :root {
    --bg: #101418; --panel: #171d24; --panel2: #1d252e; --border: #2a3440;
    --text: #d8e0e8; --dim: #7d8b99; --accent: #4da3ff; --accent2: #ffb84d;
    --danger: #ff6b6b; --ok: #4dcc7a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.6 "Segoe UI", "Microsoft YaHei", sans-serif; }
  header {
    position: sticky; top: 0; z-index: 10; background: var(--panel);
    border-bottom: 1px solid var(--border); padding: 10px 20px;
  }
  .headerInner { max-width: 940px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
  .hrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  header h1 { font-size: 16px; font-weight: 600; margin-right: 6px; white-space: nowrap; }
  .tabs { display: flex; gap: 4px; }
  .tabs button {
    background: none; border: 1px solid transparent; color: var(--dim);
    padding: 4px 14px; border-radius: 6px; cursor: pointer; font-size: 14px;
  }
  .tabs button.active { background: var(--panel2); color: var(--text); border-color: var(--border); }
  .tabs button .badge { color: var(--accent2); font-size: 12px; }
  .viewToggle { display: flex; gap: 4px; margin-left: 2px; }
  .viewToggle button {
    background: none; border: 1px solid transparent; color: var(--dim);
    padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 13px;
  }
  .viewToggle button.active { background: var(--panel2); color: var(--text); border-color: var(--border); }
  .treeHead {
    display: flex; align-items: center; gap: 6px; width: 100%;
    background: none; border: none; padding: 0; margin: 0;
    color: inherit; font: inherit; text-align: left; cursor: pointer; user-select: none;
  }
  .treeHead:hover { color: var(--text); }
  .treeHead.lv1 { font-size: 13px; color: var(--dim); font-weight: 600; border-bottom: 1px solid var(--border); padding-bottom: 4px; margin: 0 0 8px; }
  .treeHead.lv2 { font-size: 12px; color: var(--dim); font-weight: 600; padding: 6px 0 4px; margin: 8px 0 6px; border-bottom: 1px dashed var(--border); }
  .treeHead.lv3 { font-size: 12px; color: var(--dim); font-weight: 500; padding: 4px 0 3px; margin: 6px 0 4px; }
  .treeHead .chev { display: inline-block; transition: transform .15s; font-size: 11px; color: var(--dim); }
  .treeHead.collapsed .chev { transform: rotate(-90deg); }
  .treeHead .cnt { color: var(--dim); font-weight: 400; font-size: 12px; margin-left: 8px; }
  .treeKids { margin-left: 18px; }
  .projCard .meta { align-items: center; }
  .projCard summary { cursor: pointer; color: var(--accent); font-size: 13px; margin: 6px 0; }
  .analysisMd { background: var(--panel2); border: 1px solid var(--border); border-radius: 6px; padding: 10px 14px; margin-top: 6px; font-size: 13px; }
  .analysisMd h3 { font-size: 14px; color: var(--accent); margin: 10px 0 4px; }
  .analysisMd h4 { font-size: 13px; margin: 8px 0 4px; }
  .analysisMd ul { margin: 4px 0 4px 20px; }
  .analysisMd p { margin: 4px 0; }
  .introBar { background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; margin-bottom: 14px; font-size: 13px; color: var(--dim); }
  .fishWrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 4px 6px; margin-bottom: 8px; }
  .fishWrap svg { display: block; }
  .fishWrap .spine { stroke: var(--dim); stroke-width: 2; }
  .fishWrap .tick { stroke: var(--border); stroke-width: 1; }
  .fishWrap .tickLabel { fill: var(--dim); font-size: 9px; }
  g.bone { cursor: pointer; outline: none; }
  g.bone line { transition: stroke-width .1s; }
  g.bone:hover line { stroke-width: 4; }
  g.bone text { opacity: .8; }
  g.bone:hover text, g.bone.on text { opacity: 1; }
  g.bone.on line { filter: drop-shadow(0 0 3px var(--accent)); }
  #search {
    flex: 1; min-width: 180px; max-width: 420px; background: var(--panel2);
    border: 1px solid var(--border); color: var(--text); border-radius: 6px;
    padding: 5px 10px; outline: none;
  }
  #search:focus { border-color: var(--accent); }
  #projectFilter {
    background: var(--panel2); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 5px 8px; max-width: 220px;
  }
  main { max-width: 900px; margin: 0 auto; padding: 20px; }
  .day { margin-bottom: 22px; }
  .day > h2 {
    font-size: 13px; color: var(--dim); font-weight: 600;
    border-bottom: 1px solid var(--border); padding-bottom: 4px; margin-bottom: 8px;
  }
  .entry {
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 14px; margin-bottom: 8px; position: relative;
  }
  .entry.due { border-color: var(--danger); box-shadow: 0 0 0 1px var(--danger); }
  .entry .meta { font-size: 12px; color: var(--dim); display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
  .entry .meta .proj { color: var(--accent); }
  .entry .text { white-space: pre-wrap; word-break: break-word; }
  .entry .actions {
    position: absolute; top: 8px; right: 10px; display: none; gap: 6px;
  }
  .entry:hover .actions { display: flex; }
  .entry .actions button {
    background: var(--panel2); border: 1px solid var(--border); color: var(--dim);
    border-radius: 5px; padding: 2px 8px; cursor: pointer; font-size: 12px;
  }
  .entry .actions button:hover { color: var(--text); border-color: var(--dim); }
  .entry .actions button.on { color: var(--accent2); border-color: var(--accent2); }
  .entry .actions button.del:hover { color: var(--danger); border-color: var(--danger); }
  .tag { display: inline-block; font-size: 11px; border-radius: 4px; padding: 0 6px; margin-left: 6px; vertical-align: 1px; }
  .tag.memo { background: rgba(255,184,77,.15); color: var(--accent2); }
  .tag.remind { background: rgba(255,107,107,.15); color: var(--danger); }
  .tag.done { background: rgba(77,220,122,.15); color: var(--ok); }
  .entry.done .text { opacity: .45; text-decoration: line-through; }
  .remind-row { margin-top: 6px; display: none; align-items: center; gap: 8px; font-size: 12px; color: var(--dim); }
  .remind-row.open { display: flex; }
  .remind-row input[type=datetime-local] {
    background: var(--panel2); border: 1px solid var(--border); color: var(--text);
    border-radius: 5px; padding: 2px 6px; font-size: 12px;
  }
  .remind-row button {
    background: var(--panel2); border: 1px solid var(--border); color: var(--text);
    border-radius: 5px; padding: 2px 10px; cursor: pointer; font-size: 12px;
  }
  .empty { color: var(--dim); text-align: center; padding: 60px 0; }
  #status { font-size: 12px; color: var(--dim); margin-left: auto; }
  #settingsBtn {
    background: var(--panel2); border: 1px solid var(--border); color: var(--dim);
    border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 14px;
  }
  #settingsBtn:hover { color: var(--text); border-color: var(--dim); }
  dialog {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 20px; max-width: 420px; width: 90%;
  }
  dialog::backdrop { background: rgba(0,0,0,.5); }
  dialog h3 { margin-bottom: 10px; font-size: 15px; }
  dialog p { color: var(--dim); font-size: 13px; margin-bottom: 16px; white-space: pre-wrap; max-height: 120px; overflow: auto; }
  dialog .row { display: flex; gap: 10px; justify-content: flex-end; }
  dialog button {
    background: var(--panel2); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 5px 16px; cursor: pointer;
  }
  dialog button.danger { color: var(--danger); border-color: var(--danger); }
</style>
</head>
<body>
<header>
  <div class="headerInner">
    <div class="hrow">
      <h1>pi trail</h1>
      <nav class="tabs">
        <button data-tab="timeline" class="active">轨迹</button>
        <button data-tab="memos">备忘录 <span class="badge" id="memoBadge"></span></button>
        <button data-tab="reminders">提醒 <span class="badge" id="remindBadge"></span></button>
      </nav>
      <span id="status"></span>
      <button id="settingsBtn" title="同步设置">⚙</button>
    </div>
    <div class="hrow">
      <div class="viewToggle" id="viewToggle">
        <button data-view="conv">💬 对话</button>
        <button data-view="day">📅 按天</button>
        <button data-view="tree">🌲 树形</button>
        <button data-view="fish">🐟 鱼骨</button>
        <button data-view="analysis">📊 分析</button>
      </div>
      <input id="search" type="search" placeholder="搜索输入内容…">
      <select id="projectFilter"><option value="">全部项目</option></select>
    </div>
  </div>
</header>
<main id="main"></main>

<dialog id="confirmDlg">
  <h3>删除这条输入？</h3>
  <p id="confirmText"></p>
  <div class="row">
    <button id="confirmCancel">取消</button>
    <button id="confirmOk" class="danger">删除</button>
  </div>
</dialog>

<dialog id="settingsDlg">
  <h3>⚙ 同步设置</h3>
  <div style="display:flex;flex-direction:column;gap:10px;margin:12px 0 16px">
    <label>远程仓库（留空则不同步）
      <input id="cfgRemote" type="text" placeholder="git@github.com:you/pi-input-log-data.git" style="width:100%;margin-top:4px;background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px 8px">
    </label>
    <div style="display:flex;gap:16px">
      <label>同步间隔（秒）
        <input id="cfgInterval" type="number" min="10" max="86400" value="120" style="width:100px;margin-top:4px;background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px 8px">
      </label>
      <label style="display:flex;align-items:center;gap:6px;margin-top:24px">
        <input id="cfgAuto" type="checkbox"> 自动同步
      </label>
    </div>
    <label>分析模型（OpenRouter）
      <input id="cfgModel" type="text" placeholder="stealth/ox-alpha" style="width:100%;margin-top:4px;background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px 8px">
    </label>
    <button id="syncNowBtn" style="align-self:flex-start">立即同步</button>
    <div id="syncStatus" style="font-size:12px;color:var(--dim)"></div>
  </div>
  <div class="row">
    <button id="cfgCancel">关闭</button>
    <button id="cfgSave">保存</button>
  </div>
</dialog>

<script>
const $ = (s) => document.querySelector(s);
const state = {
  tab: "timeline",
  view: localStorage.getItem("pil-view") || "conv",
  collapsed: new Set(JSON.parse(localStorage.getItem("pil-collapsed") || "[]")),
  expanded: new Set(JSON.parse(localStorage.getItem("pil-expanded") || localStorage.getItem("pil-expanded-conv") || "[]")),
  entries: [],
  meta: { memos: {}, reminders: {}, deleted: {} },
  search: "",
  project: "",
  openResults: new Set(),
};

const pad = (n) => String(n).padStart(2, "0");
const fmtTime = (ts) => { const d = new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fmtDate = (ts) => { const d = new Date(ts); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const fmtDue = (ts) => { const d = new Date(ts); return `${fmtDate(ts)} ${fmtTime(ts)}`; };
const projName = (cwd) => (cwd || "").replace(/[\\/]+$/, "").split(/[\\/]/).pop() || cwd || "?";
const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const machineOf = (e) => e.machineId || e.host || "?";

function toLocalInput(ts) {
  const d = new Date(ts);
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

async function api(path, body) {
  const res = await fetch(path, body
    ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }
    : undefined);
  return res.json();
}

let analysisRendered = false; // 分析视图首次渲染后不随轮询重建（避免阅读中折叠/跳动）
let fishRendered = false; // 鱼骨视图同样不随轮询重建（保留滚动/悬停状态）

async function refresh() {
  try {
    const [e, m] = await Promise.all([api("/api/entries"), api("/api/meta")]);
    state.entries = e.items;
    state.meta = m;
    $("#status").textContent = `共 ${e.items.length} 条 · 更新于 ${fmtTime(Date.now())}`;
    if (state.tab === "timeline" && (state.view === "analysis" || state.view === "fish")) {
      const rendered = state.view === "analysis" ? analysisRendered : fishRendered;
      if (!rendered) {
        if (state.view === "analysis") await ensureAnalysisData();
        render();
      }
    } else {
      render();
    }
  } catch {
    $("#status").textContent = "服务未响应";
  }
}

function visible() {
  const q = state.search.trim().toLowerCase();
  return state.entries.filter((e) => {
    if (q && !e.text.toLowerCase().includes(q)) return false;
    if (state.project && projName(e.cwd) !== state.project) return false;
    return true;
  });
}

function actionsHtml(e) {
  const memo = state.meta.memos[e.id];
  const remind = state.meta.reminders[e.id];
  return `
    <div class="actions">
      <button class="memoBtn ${memo ? "on" : ""}" data-id="${e.id}" title="备忘录标记">📌${memo ? "已备忘" : "备忘"}</button>
      <button class="remindBtn ${remind ? "on" : ""}" data-id="${e.id}" title="设置提醒">⏰${remind ? "已提醒" : "提醒"}</button>
      <button class="del" data-id="${e.id}" title="删除">✕</button>
    </div>`;
}

function entryHtml(e, showDone, showDate) {
  const memo = state.meta.memos[e.id];
  const remind = state.meta.reminders[e.id];
  const isDue = remind && remind.due <= Date.now();
  const done = showDone && memo && memo.done;
  const timeLabel = showDate ? `${fmtDate(e.ts)} ${fmtTime(e.ts)}` : fmtTime(e.ts);
  const multiHost = new Set(state.entries.map((x) => machineOf(x))).size > 1;
  const isSkill = e.kind === "skill" || /^\/skill:/i.test(e.text || "");
  const tags =
    (isSkill ? `<span class="tag memo" style="background:rgba(77,163,255,.15);color:var(--accent)">📖 skill</span>` : "") +
    (multiHost ? `<span title="${esc(e.machineId || "")}">🖥 ${esc(e.host || machineOf(e))}</span>` : "") +
    (e.sessionId ? `<span title="session ${esc(e.sessionId)}" style="cursor:default">#${esc(String(e.sessionId).slice(0, 8))}</span>` : "") +
    (memo ? `<span class="tag memo">备忘</span>` : "") +
    (memo && memo.done ? `<span class="tag done">已完成</span>` : "") +
    (remind ? `<span class="tag remind">提醒 ${fmtDue(remind.due)}${isDue ? " · 已到期" : ""}</span>` : "");
  return `
    <div class="entry ${isDue ? "due" : ""} ${done ? "done" : ""}" data-id="${e.id}">
      <div class="meta">
        <span>${timeLabel}</span>
        <span class="proj">${esc(projName(e.cwd))}</span>
        ${e.source === "rpc" ? `<span title="pi-web 输入">rpc</span>` : ""}
        <span>${tags}</span>
      </div>
      <div class="text">${esc(e.text)}</div>
      <div class="remind-row" data-id="${e.id}">
        <label>提醒时间</label>
        <input type="datetime-local" value="${remind ? toLocalInput(remind.due) : ""}">
        <button class="remindSave">保存</button>
        <button class="remindClear">清除</button>
      </div>
      ${actionsHtml(e)}
    </div>`;
}

// 树形视图：电脑 → 项目 → 轨迹
function renderTree(list) {
  const machines = new Map(); // machineId -> { host, projects: Map(cwd -> entries[]) }
  for (const e of list) {
    const mid = machineOf(e);
    if (!machines.has(mid)) machines.set(mid, { host: e.host || mid, projects: new Map() });
    const m = machines.get(mid);
    const cwd = e.cwd || "";
    if (!m.projects.has(cwd)) m.projects.set(cwd, []);
    m.projects.get(cwd).push(e);
  }
  // 主机名重名时加 machineId 短标签消歧
  const hostCounts = {};
  for (const m of machines.values()) hostCounts[m.host] = (hostCounts[m.host] || 0) + 1;

  let html = "";
  for (const [mid, m] of machines) {
    const mk = "m:" + mid;
    const mOpen = !state.collapsed.has(mk);
    const total = [...m.projects.values()].reduce((s, a) => s + a.length, 0);
    let label = m.host;
    if (hostCounts[m.host] > 1) label += " ·" + String(mid).slice(0, 6);

    // 同机器内项目 basename 重名时显示父目录/项目名
    const bases = {};
    for (const c of m.projects.keys()) { const b = projName(c); bases[b] = (bases[b] || 0) + 1; }

    let kids = "";
    for (const [cwd, items] of m.projects) {
      const pk = "p:" + mid + ":" + cwd;
      const pOpen = !state.collapsed.has(pk);
      let plabel = projName(cwd);
      if (bases[plabel] > 1) {
        const segs = cwd.replace(/[\\/]+$/, "").split(/[\\/]/);
        plabel = segs.slice(-2).join("/");
      }
      // 项目下按对话（sessionId）分层
      const sessions = new Map();
      for (const e of items) {
        const sid = e.sessionId || "";
        if (!sessions.has(sid)) sessions.set(sid, []);
        sessions.get(sid).push(e);
      }
      const sessionArr = [...sessions.entries()].sort((a, b) => b[1][0].ts - a[1][0].ts); // 最近对话在前
      let sHtml = "";
      for (const [sid, sItems] of sessionArr) {
        const sk = "s:" + mid + ":" + cwd + ":" + sid;
        const sOpen = state.expanded.has(sk); // 树形里对话层同样默认折叠
        const newest = sItems[0], oldest = sItems[sItems.length - 1];
        const sameDay = fmtDate(oldest.ts) === fmtDate(newest.ts);
        const range = sameDay
          ? `${fmtDate(newest.ts)} ${fmtTime(oldest.ts)}–${fmtTime(newest.ts)}`
          : `${fmtDate(oldest.ts)} ${fmtTime(oldest.ts)} – ${fmtDate(newest.ts)} ${fmtTime(newest.ts)}`;
        const sT = convTitle(sItems);
        const slabel = sid ? `${esc(sT.text)}` : "未识别会话";
        const stitle = sid ? `${sT.named ? "已命名" : "派生自首条输入"} · session ${sid}` : "早期版本未记录 sessionId";
        sHtml += `<section class="day"><button type="button" class="treeHead lv3 ${sOpen ? "" : "collapsed"}" data-key="${esc(sk)}" aria-expanded="${sOpen}" title="${esc(stitle)}"><span class="chev">▾</span>💬 ${esc(slabel)}<span class="cnt">${range} · ${sItems.length} 条</span></button><div class="treeKids" style="${sOpen ? "" : "display:none"}">${sItems.map((e) => entryHtml(e, false, true)).join("")}</div></section>`;
      }
      kids += `<section class="day"><button type="button" class="treeHead lv2 ${pOpen ? "" : "collapsed"}" data-key="${esc(pk)}" aria-expanded="${pOpen}" title="${esc(cwd)}"><span class="chev">▾</span>📁 ${esc(plabel)}<span class="cnt">${items.length} 条 · ${sessionArr.length} 对话</span></button><div class="treeKids" style="${pOpen ? "" : "display:none"}">${sHtml}</div></section>`;
    }
    html += `<section class="day"><button type="button" class="treeHead lv1 ${mOpen ? "" : "collapsed"}" data-key="${esc(mk)}" aria-expanded="${mOpen}" title="${esc(mid)}"><span class="chev">▾</span>🖥 ${esc(label)}<span class="cnt">${total} 条 · ${m.projects.size} 项目</span></button><div class="treeKids" style="${mOpen ? "" : "display:none"}">${kids}</div></section>`;
  }
  return html;
}

// 会话标题：真实命名 → 首条输入派生（与 pi-web 列表效果一致）
function convTitle(items) {
  const named = items.find((e) => e.sessionName)?.sessionName;
  if (named) return { text: named, named: true };
  const firstLine = (items[items.length - 1].text || "").split("\n")[0].trim();
  const text = firstLine.length > 30 ? firstLine.slice(0, 30) + "…" : firstLine;
  return { text: text || "(空)", named: false };
}

// 对话优先视图：顶层直接是会话列表（跨机器/项目），标题 + 项目 + 时间范围
function renderConv(list) {
  const convs = new Map(); // sessionId -> entries[]
  for (const e of list) {
    const sid = e.sessionId || "";
    if (!convs.has(sid)) convs.set(sid, []);
    convs.get(sid).push(e);
  }
  const arr = [...convs.entries()].sort((a, b) => b[1][0].ts - a[1][0].ts); // 最近对话在前
  let html = "";
  for (const [sid, items] of arr) {
    const ck = "c:" + sid;
    const open = state.expanded.has(ck); // 对话默认折叠，点开的才展开
    const newest = items[0], oldest = items[items.length - 1];
    const sameDay = fmtDate(oldest.ts) === fmtDate(newest.ts);
    const range = sameDay
      ? `${fmtDate(newest.ts)} ${fmtTime(oldest.ts)}–${fmtTime(newest.ts)}`
      : `${fmtDate(oldest.ts)} ${fmtTime(oldest.ts)} – ${fmtDate(newest.ts)} ${fmtTime(newest.ts)}`;
    const t = convTitle(items);
    const label = sid ? `${esc(t.text)}` : "未识别会话";
    const stitle = sid ? `${t.named ? "已命名" : "派生自首条输入"} · session ${sid}` : "早期版本未记录 sessionId";
    const proj = projName(newest.cwd);
    html += `<section class="day"><button type="button" class="treeHead lv1 ${open ? "" : "collapsed"}" data-key="${esc(ck)}" aria-expanded="${open}" title="${esc(stitle)}"><span class="chev">▾</span>💬 ${label}<span class="cnt">${esc(proj)} · ${range} · ${items.length} 条</span></button><div class="treeKids" style="${open ? "" : "display:none"}">${items.map((e) => entryHtml(e, false, true)).join("")}</div></section>`;
  }
  return html;
}

// ---------- 项目分析（AI，手动触发） ----------

function mdToHtml(md) {
  let html = "", inList = false;
  const close = () => { if (inList) { html += "</ul>"; inList = false; } };
  for (const l of esc(md).split("\n")) {
    if (/^###\s/.test(l)) { close(); html += `<h4>${l.slice(4)}</h4>`; }
    else if (/^##\s/.test(l)) { close(); html += `<h3>${l.slice(3)}</h3>`; }
    else if (/^[-*]\s/.test(l)) { if (!inList) { html += "<ul>"; inList = true; } html += `<li>${l.slice(2)}</li>`; }
    else if (!l.trim()) close();
    else { close(); html += `<p>${l}</p>`; }
  }
  close();
  return html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
}

async function ensureAnalysisData() {
  if (!state.analysis) {
    try { state.analysis = await api("/api/analysis"); } catch { state.analysis = { model: "?", results: {} }; }
  }
}

// 项目稳定取色（路径哈希 → HSL）
function projectColor(cwd) {
  let h = 0;
  for (const c of String(cwd || "")) h = (h * 31 + c.charCodeAt(0)) % 360;
  return `hsl(${h}, 65%, 58%)`;
}

// 鱼骨图视图：中轴=当日时间线，鱼刺=对话（项目着色、粗细=条数、分层长度防叠字）
function renderFish(list) {
  fishRendered = true;
  const byDay = new Map();
  for (const e of list) {
    const d = fmtDate(e.ts);
    if (!byDay.has(d)) byDay.set(d, []);
    byDay.get(d).push(e);
  }
  let html = "";
  for (const [d, items] of [...byDay.entries()].sort((a, b) => (b[0] < a[0] ? 1 : -1))) {
    const convs = new Map();
    for (const e of items) {
      const sid = e.sessionId || "";
      if (!convs.has(sid)) convs.set(sid, []);
      convs.get(sid).push(e);
    }
    const arr = [...convs.entries()]
      .map(([sid, es]) => ({ sid, es, start: es.reduce((m, e) => Math.min(m, e.ts), Infinity) }))
      .sort((a, b) => a.start - b.start);
    const W = 900, pad = 30;
    // 密集自适应：对话越多 → 层数越多、标签越短（悬停可看全文）
    const n = arr.length;
    const nTiers = n > 18 ? 5 : n > 10 ? 4 : 3;
    const tiers = Array.from({ length: nTiers }, (_, i) => 26 + i * 24);
    const labLen = n > 18 ? 12 : n > 10 ? 18 : 26;
    const maxTier = tiers[tiers.length - 1];
    const spineY = maxTier + 34;
    const t0 = arr[0].start, t1 = Math.max(arr[arr.length - 1].start, t0 + 1);
    const X = (ts) => pad + ((W - 2 * pad) * (ts - t0)) / (t1 - t0);
    // 防重叠：同侧鱼刺标签锚点强制最小间距（时间顺序保持单调，必要时加宽画布）
    const minGap = 44;
    const lastX = { u: -Infinity, d: -Infinity };
    let nUp = 0, nDown = 0;
    for (const c of arr) {
      const side = nUp <= nDown ? -1 : 1;
      if (side < 0) nUp++; else nDown++;
      c.side = side;
      c.tier = tiers[(side < 0 ? c.upI = nUp - 1 : nDown - 1) % tiers.length];
      const k = side < 0 ? "u" : "d";
      let x = X(c.start);
      if (x - lastX[k] < minGap) x = lastX[k] + minGap;
      lastX[k] = x;
      c.x = x;
    }
    const W2 = Math.max(W, ...arr.map((c) => c.x + c.tier * 0.6 + labLen * 5 + pad));
    let bones = "";
    for (const c of arr) {
      const { side, tier, x: bx } = c;
      const tipX = bx + tier * 0.6, tipY = spineY + side * tier;
      const col = projectColor(c.es[0].cwd);
      const t = convTitle(c.es);
      const label = `${fmtTime(c.start)} ${t.text}`.slice(0, labLen);
      const key = `f:${c.sid}:${d}`;
      const open = state.expanded.has(key);
      const rot = side < 0 ? -35 : 35;
      const ly = side < 0 ? tipY - 4 : tipY + 11;
      bones += `<g pointer-events="bounding-box" class="bone ${open ? "on" : ""}" data-key="${esc(key)}" tabindex="0" role="button" aria-expanded="${open}" title="${esc(`${t.text}\n${projName(c.es[0].cwd)} · ${c.es.length} 条 · ${fmtTime(c.start)} 开始`)}"><line x1="${bx}" y1="${spineY}" x2="${tipX}" y2="${tipY}" stroke="${col}" stroke-width="${Math.min(2 + c.es.length * 0.35, 5)}"/><circle cx="${tipX}" cy="${tipY}" r="2.6" fill="${col}"/><text x="${tipX + 3}" y="${ly}" transform="rotate(${rot} ${tipX} ${tipY})" fill="${col}" font-size="10">${esc(label)}</text></g>`;
    }
    let ticks = "";
    for (let i = 0; i <= 6; i++) {
      const tx = pad + ((W2 - 2 * pad) * i) / 6;
      const dd = new Date(t0 + ((t1 - t0) * i) / 6);
      ticks += `<line class="tick" x1="${tx}" y1="${spineY - 4}" x2="${tx}" y2="${spineY + 4}"/><text class="tickLabel" x="${tx}" y="${spineY + 16}" text-anchor="middle">${String(dd.getHours()).padStart(2, "0")}:${String(dd.getMinutes()).padStart(2, "0")}</text>`;
    }
    const expandedHtml = arr
      .filter((c) => state.expanded.has(`f:${c.sid}:${d}`))
      .map((c) => `<div style="margin-bottom:10px"><div style="font-size:12px;color:var(--dim);margin:4px 0">💬 ${esc(convTitle(c.es).text)} · ${esc(projName(c.es[0].cwd))}</div>${c.es.slice().sort((a, b) => b.ts - a.ts).map((e) => entryHtml(e, false, true)).join("")}</div>`)
      .join("");
    html += `<section class="day"><h2>${d} · ${items.length} 条 · ${arr.length} 场对话</h2><div class="fishWrap"><svg width="${W2}" height="${spineY + maxTier + 36}" viewBox="0 0 ${W2} ${spineY + maxTier + 36}" xmlns="http://www.w3.org/2000/svg"><line class="spine" x1="8" y1="${spineY}" x2="${W2 - 8}" y2="${spineY}"/>${ticks}${bones}</svg></div>${expandedHtml}</section>`;
  }
  return html;
}

function renderAnalysis() {
  analysisRendered = true;
  const main = $("#main");
  const projs = new Map();
  for (const e of state.entries) {
    if (!projs.has(e.cwd)) projs.set(e.cwd, []);
    projs.get(e.cwd).push(e);
  }
  const arr = [...projs.entries()].sort((a, b) => b[1][0].ts - a[1][0].ts);
  let html = `<div class="introBar">📊 基于该项目文件夹的全部输入调用 AI 推断项目进展 — 手动触发，每次消耗模型配额。当前模型：<b>${esc(state.analysis?.model || "?")}</b>（⚙ 里可换）</div>`;
  for (const [cwd, items] of arr) {
    const r = state.analysis?.results?.[cwd];
    const newest = items[0], oldest = items[items.length - 1];
    const named = items.find((e) => e.sessionId && e.sessionName)?.sessionName;
    html += `<div class="entry projCard" data-proj="${esc(cwd)}">
      <div class="meta">
        <span class="proj" style="font-size:14px">📁 ${esc(projName(cwd))}</span>
        <span title="${esc(cwd)}">${esc(cwd)}</span>
        <span>${items.length} 条输入</span>
        <span>${fmtDate(oldest.ts)} ~ ${fmtDate(newest.ts)}</span>
        ${r ? `<span>上次分析 ${fmtDate(r.ts)} ${fmtTime(r.ts)}</span>` : "<span style='opacity:.6'>未分析</span>"}
      </div>
      <div class="actions" style="display:flex">
        <button class="analyzeBtn ${r ? "on" : ""}" data-id="${esc(cwd)}">${r ? "🤖 重新分析" : "🤖 分析"}</button>
      </div>
      ${r ? `<details class="analysisResult" ${state.openResults.has(cwd) ? "open" : ""}><summary>查看分析结果（${r.inputCount} 条输入 · ${esc(r.model)}）</summary><div class="analysisMd">${mdToHtml(r.result)}</div></details>` : ""}
    </div>`;
  }
  main.innerHTML = html;
}

function render() {
  // 项目过滤器选项
  const projs = [...new Set(state.entries.map((e) => projName(e.cwd)))].sort();
  const sel = $("#projectFilter");
  const cur = sel.value || state.project;
  sel.innerHTML = `<option value="">全部项目</option>` + projs.map((p) => `<option ${p === cur ? "selected" : ""}>${esc(p)}</option>`).join("");

  // 徽标与列表同口径：只统计条目仍存在的备忘/提醒（孤儿事件不计）
  const memoCount = state.entries.filter((e) => state.meta.memos[e.id] && !state.meta.memos[e.id].done).length;
  const remindCount = state.entries.filter((e) => state.meta.reminders[e.id] && state.meta.reminders[e.id].due > Date.now()).length;
  $("#memoBadge").textContent = memoCount ? `(${memoCount})` : "";
  $("#remindBadge").textContent = remindCount ? `(${remindCount})` : "";

  const main = $("#main");
  const list = visible();

  if (state.tab === "timeline" && state.view === "fish") {
    main.innerHTML = renderFish(list);
    return;
  }
  if (state.tab === "timeline" && state.view === "analysis") {
    renderAnalysis();
    return;
  }
  if (state.tab === "timeline") {
    if (!list.length) { main.innerHTML = `<div class="empty">暂无记录 — 在 pi 里随便输入点什么，几秒后这里就会出现</div>`; return; }
    if (state.view === "conv") {
      main.innerHTML = renderConv(list);
      return;
    }
    if (state.view === "tree") {
      main.innerHTML = renderTree(list);
      return;
    }
    const byDay = new Map();
    for (const e of list) {
      const d = fmtDate(e.ts);
      if (!byDay.has(d)) byDay.set(d, []);
      byDay.get(d).push(e);
    }
    main.innerHTML = [...byDay.entries()].map(([d, items]) =>
      `<section class="day"><h2>${d} · ${items.length} 条</h2>${items.map((e) => entryHtml(e)).join("")}</section>`
    ).join("");
  } else if (state.tab === "memos") {
    const memos = list.filter((e) => state.meta.memos[e.id]);
    if (!memos.length) { main.innerHTML = `<div class="empty">还没有备忘 — 在轨迹里点「📌 备忘」把某条输入钉到这里</div>`; return; }
    main.innerHTML = memos.map((e) => `
      <div class="entry ${state.meta.memos[e.id].done ? "done" : ""}" data-id="${e.id}">
        <div class="meta"><span>${fmtDate(e.ts)} ${fmtTime(e.ts)}</span><span class="proj">${esc(projName(e.cwd))}</span></div>
        <div class="text">${esc(e.text)}</div>
        <div class="actions" style="display:flex">
          <button class="memoDone" data-id="${e.id}">${state.meta.memos[e.id].done ? "↩ 取消完成" : "✓ 完成"}</button>
          <button class="memoBtn on" data-id="${e.id}">取消备忘</button>
        </div>
      </div>`).join("");
  } else {
    // 提醒 tab 原有逻辑
    const now = Date.now();
    const re = list.filter((e) => state.meta.reminders[e.id]);
    const due = re.filter((e) => state.meta.reminders[e.id].due <= now);
    const upcoming = re.filter((e) => state.meta.reminders[e.id].due > now).sort((a, b) => state.meta.reminders[a.id].due - state.meta.reminders[b.id].due);
    if (!re.length) { main.innerHTML = `<div class="empty">还没有提醒 — 在轨迹里点「⏰ 提醒」给某条输入设定时间</div>`; return; }
    const sec = (title, items) => items.length
      ? `<section class="day"><h2>${title} · ${items.length} 条</h2>${items.map((e) => entryHtml(e, true)).join("")}</section>` : "";
    main.innerHTML = sec("已到期", due) + sec("即将到来", upcoming) +
      `<p style="color:var(--dim);font-size:12px;margin-top:10px">提示：到期条目会红框高亮（页面打开时可见，不做系统通知）。</p>`;
  }
}

// ---------- 事件 ----------

function syncHeader() {
  // 视图切换只属于轨迹 tab；其他 tab 不显示
  $("#viewToggle").style.display = state.tab === "timeline" ? "flex" : "none";
}

document.querySelectorAll(".tabs button").forEach((b) =>
  b.addEventListener("click", async () => {
    state.tab = b.dataset.tab;
    document.querySelectorAll(".tabs button").forEach((x) => x.classList.toggle("active", x === b));
    syncHeader();
    if (state.tab === "timeline" && state.view === "analysis") await ensureAnalysisData();
    render();
  }));
syncHeader();

document.querySelectorAll("#viewToggle button").forEach((b) =>
  b.addEventListener("click", async () => {
    state.view = b.dataset.view;
    localStorage.setItem("pil-view", state.view);
    syncViewToggle();
    if (state.view === "analysis") await ensureAnalysisData();
    render();
  }));
function syncViewToggle() {
  document.querySelectorAll("#viewToggle button").forEach((x) => x.classList.toggle("active", x.dataset.view === state.view));
}
syncViewToggle();

let searchTimer;
$("#search").addEventListener("input", (ev) => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { state.search = ev.target.value; render(); }, 200);
});
$("#projectFilter").addEventListener("change", (ev) => { state.project = ev.target.value; render(); });

$("#main").addEventListener("toggle", (ev) => {
  const d = ev.target;
  if (d && d.matches && d.matches("details.analysisResult")) {
    const proj = d.closest(".projCard")?.dataset.proj;
    if (!proj) return;
    if (d.open) state.openResults.add(proj);
    else state.openResults.delete(proj);
  }
}, true);

$("#main").addEventListener("click", async (ev) => {
  const bone = ev.target.closest && ev.target.closest("g.bone");
  if (bone) {
    const k = bone.dataset.key;
    if (state.expanded.has(k)) state.expanded.delete(k); else state.expanded.add(k);
    localStorage.setItem("pil-expanded", JSON.stringify([...state.expanded]));
    const savedScroll = [...document.querySelectorAll(".fishWrap")].map((el) => el.scrollLeft);
    render();
    document.querySelectorAll(".fishWrap").forEach((el, i) => { if (savedScroll[i] != null) el.scrollLeft = savedScroll[i]; });
    return;
  }
  const head = ev.target.closest(".treeHead");
  if (head) {
    const k = head.dataset.key;
    // 对话（c:）/树形对话层（s:）/鱼骨（f:）默认折叠 → 「已展开」集合
    const defaultCollapsed = k.startsWith("c:") || k.startsWith("s:") || k.startsWith("f:");
    const set = defaultCollapsed ? state.expanded : state.collapsed;
    if (set.has(k)) set.delete(k); else set.add(k);
    localStorage.setItem(defaultCollapsed ? "pil-expanded" : "pil-collapsed", JSON.stringify([...set]));
    render();
    return;
  }
  const btn = ev.target.closest("button");
  const entryEl = ev.target.closest(".entry");
  if (!entryEl) return;
  const id = entryEl.dataset.id;

  if (btn && btn.classList.contains("memoBtn")) {
    const on = !state.meta.memos[id];
    await api("/api/memo", { id, memo: on });
    refresh(); return;
  }
  if (btn && btn.classList.contains("memoDone")) {
    await api("/api/memo", { id, memo: true, done: !state.meta.memos[id].done });
    refresh(); return;
  }
  if (btn && btn.classList.contains("remindBtn")) {
    entryEl.querySelector(".remind-row").classList.toggle("open");
    return;
  }
  if (btn && btn.classList.contains("remindSave")) {
    const v = entryEl.querySelector(".remind-row input").value;
    if (v) await api("/api/remind", { id, due: new Date(v).getTime() });
    refresh(); return;
  }
  if (btn && btn.classList.contains("remindClear")) {
    await api("/api/remind", { id, due: null });
    refresh(); return;
  }
  if (btn && btn.classList.contains("analyzeBtn")) {
    const proj = btn.dataset.id;
    btn.disabled = true;
    btn.textContent = "⏳ 分析中…（可能半分钟）";
    try {
      const r = await api("/api/analyze", { project: proj });
      if (!state.analysis) state.analysis = { model: "", results: {} };
      state.analysis.results[proj] = r;
      state.openResults.add(proj);
    } catch (e) {
      alert("分析失败：" + (e && e.message ? e.message : e));
    }
    renderAnalysis();
    return;
  }
  if (btn && btn.classList.contains("del")) {
    const e = state.entries.find((x) => x.id === id);
    $("#confirmText").textContent = e ? e.text : "";
    const dlg = $("#confirmDlg");
    dlg.showModal();
    $("#confirmOk").onclick = async () => { await api("/api/delete", { id }); dlg.close(); refresh(); };
    $("#confirmCancel").onclick = () => dlg.close();
  }
});

$("#main").addEventListener("keydown", (ev) => {
  if ((ev.key === "Enter" || ev.key === " ") && ev.target.closest && ev.target.closest("g.bone")) {
    ev.preventDefault();
    ev.target.closest("g.bone").dispatchEvent(new MouseEvent("click", { bubbles: true }));
  }
});

refresh();
setInterval(refresh, 5000);

// ---------- 设置 ----------

function fmtSync(s) {
  if (!s || !s.at) return "尚未同步";
  const t = `${pad(new Date(s.at).getHours())}:${pad(new Date(s.at).getMinutes())}:${pad(new Date(s.at).getSeconds())}`;
  return s.ok ? `上次同步 ${t} · 成功` : `上次同步 ${t} · 失败：${s.error || "未知错误"}`;
}

$("#settingsBtn").addEventListener("click", async () => {
  const cfg = await api("/api/config");
  $("#cfgRemote").value = cfg.remote || "";
  $("#cfgInterval").value = cfg.syncIntervalSec ?? 120;
  $("#cfgAuto").checked = cfg.autoSync !== false;
  $("#cfgModel").value = cfg.analysisModel || "";
  $("#syncStatus").textContent = fmtSync(cfg.lastSync);
  $("#settingsDlg").showModal();
});

$("#cfgSave").addEventListener("click", async () => {
  const cfg = await api("/api/config", {
    remote: $("#cfgRemote").value,
    syncIntervalSec: Number($("#cfgInterval").value),
    autoSync: $("#cfgAuto").checked,
    analysisModel: $("#cfgModel").value.trim(),
  });
  $("#syncStatus").textContent = "已保存 · " + fmtSync(cfg.lastSync);
});

$("#cfgCancel").addEventListener("click", () => $("#settingsDlg").close());

$("#syncNowBtn").addEventListener("click", async () => {
  $("#syncStatus").textContent = "同步中…";
  const r = await api("/api/sync", {});
  $("#syncStatus").textContent = fmtSync(r.at ? { at: r.at, ok: r.ok, error: r.error } : null) + (r.ok ? "" : "");
});
</script>
